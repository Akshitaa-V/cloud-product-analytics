# KPI library
# One entry per KPI. Every entry points to the SQL that computes it and to the
# Power BI measures that show it. Tests check that this file, the SQL and the
# DAX measures stay in sync. Render the docs with:
#   python -m product_analytics.kpi_library
version: 1
kpis:
  - id: active_users
    name: Active users and stickiness
    question: How many people use the platform, and how often do they come back?
    owner: Product Management
    grain: one row per calendar day
    table: kpi_active_users
    sql: sql/gold/kpi_active_users.sql
    definition: >
      A user is active on a day when they send at least one valid event from a
      customer account. WAU and MAU count distinct active users in the 7 and 28
      days ending on that date.
    formula: stickiness = DAU / MAU
    columns: [date, dau, wau, mau, stickiness, is_full_window]
    caveats: >
      The first 27 days of the window do not have a full 28-day history; use
      is_full_window = true for trend charts. Internal test accounts are excluded.
    power_bi_measures: [Active Users, WAU (7d), MAU (28d), Stickiness (28d)]

  - id: activation
    name: Activation rate
    question: Do new users reach their first moment of value in their first week?
    owner: Product Management
    grain: one row per signup week and main client (web or mobile)
    table: kpi_activation
    sql: sql/gold/kpi_activation.sql
    definition: >
      A new user is activated when they create a measurement or a share link
      within day 0 to day 6 after their account was created.
    formula: activation_rate = activated_users / new_users
    columns: [signup_week, primary_client, new_users, activated_users, activation_rate, median_days_to_activation]
    caveats: >
      Only users created inside the reporting window whose 7-day window has
      ended are counted, so the latest week is never half-measured.
    power_bi_measures: [New Users, Activated Users, Activation Rate]

  - id: retention_weekly
    name: Weekly cohort retention
    question: What share of each signup cohort is still active n weeks later?
    owner: Product Management
    grain: one row per signup week, activation segment and week number (0 to 12)
    table: kpi_retention_weekly
    sql: sql/gold/kpi_retention_weekly.sql
    definition: >
      Week n covers days 7n to 7n+6 after a user was created. A user is retained
      in week n when they are active on at least one day of that week.
    formula: retention_rate = retained_users / cohort_size
    columns: [signup_week, is_activated, week_number, cohort_size, retained_users, retention_rate]
    caveats: >
      A cohort week is shown only after every user in the cohort could have
      reached it. Split by is_activated to compare activated and not activated users.
    power_bi_measures: [Retention Rate]

  - id: feature_adoption
    name: Feature adoption
    question: Which product features do active customer accounts use each month?
    owner: Product Management
    grain: one row per month and feature
    table: kpi_feature_adoption
    sql: sql/gold/kpi_feature_adoption.sql
    definition: >
      An account adopts a feature in a month when any of its users sends at
      least one event of that feature. The base is every account active that month.
    formula: adoption_rate = adopting_accounts / active_accounts
    columns: [month, feature, adopting_accounts, active_accounts, adoption_rate]
    caveats: >
      Measured per account, not per user. A feature with no adopters in a month
      has no row for that month.
    power_bi_measures: [Feature Adoption Rate]

  - id: upload_funnel
    name: Upload to share funnel
    question: How many uploaded datasets get processed, opened and shared?
    owner: Cloud Engineering
    grain: one row per upload month
    table: kpi_upload_funnel
    sql: sql/gold/kpi_upload_funnel.sql
    definition: >
      Each dataset moves through four steps - uploaded, processed successfully,
      opened in the viewer after processing, shared with a link after processing.
    formula: upload_to_share_rate = shared / uploaded
    columns: [upload_month, uploaded, processed, viewed, shared, processed_rate, viewed_rate, shared_rate, upload_to_share_rate]
    caveats: >
      Counts datasets, not events. Datasets uploaded late in the last month have
      had less time to be opened and shared.
    power_bi_measures: [Uploads, Upload to Share Rate]

  - id: processing_time
    name: Processing time and failure rate
    question: How long does dataset processing take, and how often does it fail?
    owner: Cloud Engineering
    grain: one row per week (Monday start)
    table: kpi_processing_time
    sql: sql/gold/kpi_processing_time.sql
    definition: >
      Median and 90th percentile duration of successful processing jobs, and the
      share of finished jobs that failed. pipeline_version is the most common
      release in that week.
    formula: failure_rate = failed_jobs / (processed_jobs + failed_jobs)
    columns: [week_start, processed_jobs, failed_jobs, median_processing_min, p90_processing_min, failure_rate, pipeline_version]
    caveats: >
      Weeks at the edges of the window are partial. Duration depends on dataset
      size, so compare weeks, not single jobs.
    power_bi_measures: [Processing Jobs, Median Processing (min), Processing Failure Rate]

  - id: account_health
    name: Account health (seat utilisation)
    question: Which customer accounts use far fewer seats than they pay for?
    owner: Customer Success
    grain: one row per customer account and month
    table: kpi_account_health
    sql: sql/gold/kpi_account_health.sql
    definition: >
      Seat utilisation is the number of distinct active users in a month divided
      by the account's licensed seats. at_risk below 30 percent, watch from 30 to
      below 60 percent, healthy from 60 percent.
    formula: seat_utilization = active_users / seats
    columns: [month, account_id, plan, industry, seats, active_users, events, uploads, seat_utilization, health_status]
    caveats: >
      Thresholds are a starting point for Customer Success and should be tuned
      against real churn. Rows start in the account's signup month.
    power_bi_measures: [Seat Utilization, At-Risk Accounts]
